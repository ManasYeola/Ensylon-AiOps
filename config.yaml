correlation:
  window_minutes: 5
  strong_edge_threshold: 0.70

  weights:
    temporal: 0.25
    service: 0.25
    component: 0.15
    topology: 0.20
    evidence_similarity: 0.15

severity:
  blast: 0.35
  criticality: 0.35
  trend: 0.20
  magnitude: 0.10


confidence:
  density: 0.35
  agreement: 0.25
  topology: 0.20
  temporal: 0.20

detection:
  zscore_threshold: 3.0
  window_size: 20
  ewma_alpha: 0.3
  zscore_cap: 6.0          # z-score at which anomaly_score saturates to 1.0
  anomaly_threshold: 0.40  # minimum anomaly_score to enter correlation pipeline

  # Log burst detection (sliding-window frequency tracker)
  log_window_seconds: 300   # width of the sliding count window (5 min)
  log_bucket_seconds: 60    # time-bucket resolution (1 min); one bucket expires per minute
  log_baseline_windows: 5   # number of complete windows used to learn the baseline rate
  log_burst_multiplier: 3.0 # current/baseline ratio at which anomaly_score reaches 0.5

validation:
  coherence_avg_threshold: 0.60
  coherence_strong_ratio: 0.50
  bridge_strong_threshold: 0.70

fingerprint:
  continuation_window_minutes: 60
  similarity_threshold: 0.70
